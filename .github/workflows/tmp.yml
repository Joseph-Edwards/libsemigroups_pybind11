name: A basic test for debugging
on: workflow_dispatch
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-tests:
    name: macOS-latest Python 3.10
    strategy:
      fail-fast: false
    runs-on: macOS-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash -l {0}
    env:
      CXX: "ccache clang++"
      CXXFLAGS: "-O0 -g3"
      UV_NO_SYNC: "1"
      LD_LIBRARY_PATH: "/usr/local/lib"
    steps:
      # Setup environment
      - uses: actions/checkout@v6
      - name: Install uv and set the Python version
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.10"
          enable-cache: true

      # Build libsemigroups
      - name: "Install libsemigroups dependencies . . ."
        run: brew install autoconf automake libtool
      - name: Check versions
        run: |
          uv run python --version
          clang++ --version
      - name: "Setup ccache . . ."
        uses: Chocobo1/setup-ccache-action@v1
        with:
          update_packager_index: false
          install_ccache: true
      - name: "Install libsemigroups . . ."
        run: |
          git clone --depth 1 --branch main https://github.com/libsemigroups/libsemigroups.git
          cd libsemigroups
          ./autogen.sh && ./configure CXX="$CXX" CXXFLAGS="$CXXFLAGS" --enable-debug && sudo make install -j4
          ccache -s

      # Build libsemigroups_pybind11
      - name: "Install libsemigroups_pybind11 . . ."
        run: uv sync --verbose --locked --all-extras --no-dev

        # Run the tests
      - name: "Running tests . . ."
        run: uv run pytest -vvv tests/test_schreier_sims.py
